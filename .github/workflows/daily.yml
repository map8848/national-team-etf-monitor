name: 每日刷新公开数据快照

on:
  schedule:
    # 上游份额日报约在北京时间 17:00–18:00 生成（T+1 收盘份额）。
    # 本仓库实测 GitHub 定时任务稳定延迟 8–11 小时，因此把四个时段排在 UTC 01/03/05/07 点，
    # 实际落地约在北京 17:00–23:00；任一命中新交易日即提交，其余因交易日未前进而自动跳过。
    - cron: '23 1 * * 1-5'    # 配置 北京 09:23 → 实际约 北京 17:23
    - cron: '23 3 * * 1-5'    # 配置 北京 11:23 → 实际约 北京 19:23
    - cron: '23 5 * * 1-5'    # 配置 北京 13:23 → 实际约 北京 21:23
    - cron: '23 7 * * 1-5'    # 配置 北京 15:23 → 实际约 北京 23:23
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 采集并计算
        run: node scripts/gather.mjs && node scripts/build.mjs
      - name: 提交快照
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          TRADE_DATE=$(node -p "require('./data/dashboard.json').meta.tradeDate")
          git add data/
          if git diff --cached --quiet; then
            echo "snapshot unchanged ($TRADE_DATE)"
          else
            git commit -m "data: refresh $TRADE_DATE snapshot"
            git push
          fi
