name: 每日刷新公开数据快照

on:
  schedule:
    # 北京时间 16:40，交易所份额日报披露后
    - cron: '40 8 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 采集并计算
        run: node scripts/gather.mjs && node scripts/build.mjs
      - name: 提交快照
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "snapshot unchanged"
          else
            git commit -m "data: refresh $(date -u +%Y-%m-%d) snapshot"
            git push
          fi
